# MeetNippon — isolated stack. Project name: meetnippon (docker compose -p meetnippon).
# All host port bindings are 127.0.0.1-only (public access is via nginx in prod).
# db & redis have NO host binding — internal to this compose network only.
name: meetnippon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_BUILD_TARGET:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - api_node_modules:/app/node_modules
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_BUILD_TARGET:-dev}
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ROLE: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]
    networks: [internal]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8084}:8025"
    networks: [internal]

  web-user:
    build:
      context: .
      dockerfile: apps/web-user/Dockerfile
      target: ${WEB_BUILD_TARGET:-dev}
    restart: unless-stopped
    env_file: .env
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_USER_PORT:-8082}:3000"
    profiles: ["web"]
    networks: [internal]

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      target: ${WEB_BUILD_TARGET:-dev}
    restart: unless-stopped
    env_file: .env
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_ADMIN_PORT:-8083}:3000"
    profiles: ["web"]
    networks: [internal]

volumes:
  db_data:
  redis_data:
  api_node_modules:

networks:
  internal:
    driver: bridge
